    <path class="data-synapse" d="M332 215V267Q332 285 350 295L443 349Q465 362 465 385V500" pathLength="100" style="animation-delay:-0.68s;animation-duration:4.819999999999999s"/>
    <path class="data-synapse" d="M598 215V267Q598 285 580 295L487 349Q465 362 465 385V500" pathLength="100" style="animation-delay:-1.36s;animation-duration:5.04s"/>
