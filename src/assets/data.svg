    <path class="data-synapse" d="M660 330H621Q605 330 590 342L499 414Q465 440 465 468V500" pathLength="100" style="animation-delay:-2.72s;animation-duration:5.4799999999999995s"/>
    <path class="data-synapse" d="M350 432H387Q406 432 420 447L450 478Q465 493 465 500" pathLength="100" style="animation-delay:-3.4000000000000004s;animation-duration:5.699999999999999s"/>
    <path class="data-synapse" d="M580 432H543Q524 432 510 447L480 478Q465 493 465 500" pathLength="100" style="animation-delay:-4.08s;animation-duration:5.92s"/>
  </g>
  <g fill="#111214" stroke="#F2801E" stroke-width="2">
