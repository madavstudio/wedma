<svg xmlns="http://www.w3.org/2000/svg" width="770" height="1090" viewBox="80 110 770 1090" fill="none">
  <defs>
    <radialGradient id="networkAura" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(465 348) rotate(90) scale(286 282)">
      <stop stop-color="#F2801E" stop-opacity="0.10"/>
      <stop offset="0.52" stop-color="#F2801E" stop-opacity="0.035"/>
      <stop offset="1" stop-color="#F2801E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="networkLine" x1="300" y1="170" x2="610" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E6E6E6" stop-opacity="0.18"/>
      <stop offset="0.48" stop-color="#F2801E" stop-opacity="0.52"/>
      <stop offset="1" stop-color="#F2801E" stop-opacity="0.82"/>
    </linearGradient>
    <linearGradient id="platformTop" x1="210" y1="470" x2="690" y2="810" gradientUnits="userSpaceOnUse">
      <stop stop-color="#202326"/>
      <stop offset=".5" stop-color="#1B1E21"/>
      <stop offset="1" stop-color="#151719"/>
    </linearGradient>
    <linearGradient id="platformSide" x1="465" y1="616" x2="465" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#24272B"/><stop offset="1" stop-color="#111214"/>
    </linearGradient>
    <linearGradient id="baseTop" x1="220" y1="750" x2="700" y2="990" gradientUnits="userSpaceOnUse">
      <stop stop-color="#202326"/><stop offset="1" stop-color="#151719"/>
    </linearGradient>
    <linearGradient id="surfaceEdge" x1="145" y1="620" x2="785" y2="620" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F2801E" stop-opacity=".18"/>
      <stop offset=".5" stop-color="#F2801E" stop-opacity=".72"/>
      <stop offset="1" stop-color="#F2801E" stop-opacity=".18"/>
    </linearGradient>
    <filter id="mainShadow" x="-25%" y="-30%" width="150%" height="180%">
      <feDropShadow dx="0" dy="22" stdDeviation="20" flood-color="#000" flood-opacity=".18"/>
    </filter>
    <filter id="chipShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".18"/>
    </filter>
    <linearGradient id="engravedStroke" x1="0" y1="0" x2="0.7" y2="1">
      <stop stop-color="#070809"/><stop offset=".5" stop-color="#191B1D"/><stop offset="1" stop-color="#3A3D40"/>
    </linearGradient>
    <linearGradient id="engravedFace" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#E8E9E9"/><stop offset=".35" stop-color="#F8F8F7"/><stop offset="1" stop-color="#FFF"/>
    </linearGradient>
    <filter id="engravedEdge" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1.2" stdDeviation=".25" flood-color="#FFF" flood-opacity=".95"/>
      <feDropShadow dx="0" dy="-.7" stdDeviation=".3" flood-color="#000" flood-opacity=".22"/>
    </filter>
    <filter id="portalGlow" x="-80%" y="-50%" width="260%" height="220%"><feGaussianBlur stdDeviation="26"/></filter>
    <filter id="lineGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="nodeGlow" x="-250%" y="-250%" width="600%" height="600%">
      <feGaussianBlur stdDeviation="9" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Separate circuit lanes echo the 45-degree routes in Mission. -->
  <ellipse class="data-glow" cx="465" cy="350" rx="286" ry="270" fill="url(#networkAura)"/>
  <g fill="none" stroke="url(#networkLine)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M465 162V500"/>
    <path d="M320 210V278Q320 284 326 290L420 384Q428 392 428 404V514"/>
    <path d="M610 210V278Q610 284 604 290L510 384Q502 392 502 404V514"/>
    <path d="M232 320H288Q296 320 302 326L382 406Q390 414 390 424V534"/>
    <path d="M698 320H642Q634 320 628 326L548 406Q540 414 540 424V534"/>
    <path d="M276 438H322Q330 438 336 444L354 462Q362 470 362 480V555"/>
    <path d="M654 438H608Q600 438 594 444L576 462Q568 470 568 480V555"/>
  </g>
  <g fill="none" stroke="#F2801E" stroke-width="2.3" stroke-linecap="round">
    <path class="data-synapse" d="M465 162V500" pathLength="100" style="animation-delay:-0.0s;animation-duration:5.00s"/>
    <path class="data-synapse" d="M320 210V278Q320 284 326 290L420 384Q428 392 428 404V514" pathLength="100" style="animation-delay:-0.7s;animation-duration:5.22s"/>
    <path class="data-synapse" d="M610 210V278Q610 284 604 290L510 384Q502 392 502 404V514" pathLength="100" style="animation-delay:-1.4s;animation-duration:5.44s"/>
    <path class="data-synapse" d="M232 320H288Q296 320 302 326L382 406Q390 414 390 424V534" pathLength="100" style="animation-delay:-2.1s;animation-duration:5.66s"/>
    <path class="data-synapse" d="M698 320H642Q634 320 628 326L548 406Q540 414 540 424V534" pathLength="100" style="animation-delay:-2.8s;animation-duration:5.88s"/>
    <path class="data-synapse" d="M276 438H322Q330 438 336 444L354 462Q362 470 362 480V555" pathLength="100" style="animation-delay:-3.5s;animation-duration:6.10s"/>
    <path class="data-synapse" d="M654 438H608Q600 438 594 444L576 462Q568 470 568 480V555" pathLength="100" style="animation-delay:-4.2s;animation-duration:6.32s"/>
  </g>
  <g fill="#1B1E21" stroke="#F2801E" stroke-width="1.5">
    <path d="M465 156l6 6-6 6-6-6Z"/>
    <path d="M320 204l6 6-6 6-6-6Z"/>
    <path d="M610 204l6 6-6 6-6-6Z"/>
    <path d="M232 314l6 6-6 6-6-6Z"/>
    <path d="M698 314l6 6-6 6-6-6Z"/>
    <path d="M276 432l6 6-6 6-6-6Z"/>
    <path d="M654 432l6 6-6 6-6-6Z"/>
  </g>
  <g class="data-neurons" fill="#F2801E">
    <circle cx="465" cy="162" r="2"/>
    <circle cx="320" cy="210" r="2"/>
    <circle cx="610" cy="210" r="2"/>
    <circle cx="232" cy="320" r="2"/>
    <circle cx="698" cy="320" r="2"/>
    <circle cx="276" cy="438" r="2"/>
    <circle cx="654" cy="438" r="2"/>
  </g>
  <!-- Thin, chamfered processor layers replace the cylindrical pedestal. -->
  <g stroke-linejoin="round" filter="url(#mainShadow)">
    <path d="M157 830 457 672Q465 668 473 672L773 830V887L473 1045Q465 1049 457 1045L157 887Z" fill="url(#platformSide)" stroke="#34383D" stroke-width="2"/>
    <path d="M165 814 457 660Q465 656 473 660L765 814Q781 823 765 832L473 986Q465 990 457 986L165 832Q149 823 165 814Z" fill="url(#baseTop)" stroke="#41454B" stroke-width="2"/>
    <path d="M165 814 457 660Q465 656 473 660L765 814Q781 823 765 832L473 986Q465 990 457 986L165 832Q149 823 165 814Z" transform="translate(465 823) scale(.945) translate(-465 -823)" stroke="#FFF" stroke-opacity=".045" stroke-width="1.5"/>
    <path d="m184 825 273 145q8 4 16 0l273-145M465 991v49" stroke="#41454B" stroke-width="1.5"/>
    <path d="m252 897 27 14m-3-26 27 14m-3-26 27 14m321 10-27 14m3-26-27 14m3-26-27 14" stroke="#747982" stroke-opacity=".38" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Sparse circuit routes and square contacts match the How it works scene. -->
  <g fill="none" stroke="#41454B" stroke-width="2" stroke-linejoin="round">
    <path d="M211 822 319 878 369 852M719 822 611 878 561 852M465 941V898"/>
    <path d="m204 822 7-4 7 4-7 4Zm508 0 7-4 7 4-7 4ZM458 944l7-4 7 4-7 4Z" fill="#F2801E" stroke="none"/>
  </g>
  <path d="M240 770V801M690 770V801M465 831V876" stroke="#F2801E" stroke-opacity=".35" stroke-width="2"/>

  <!-- Upper graphite slab: restrained corner radii and visible straight edges. -->
  <g stroke-linejoin="round">
    <path d="M137 620 457 451Q465 447 473 451L793 620V682L473 851Q465 855 457 851L137 682Z" fill="url(#platformSide)" stroke="#34383D" stroke-width="2"/>
    <path d="M145 608 457 443Q465 439 473 443L785 608Q801 617 785 626L473 791Q465 795 457 791L145 626Q129 617 145 608Z" fill="url(#platformTop)" stroke="#41454B" stroke-width="2"/>
    <path d="M145 608 457 443Q465 439 473 443L785 608Q801 617 785 626L473 791Q465 795 457 791L145 626Q129 617 145 608Z" transform="translate(465 617) scale(.945) translate(-465 -617)" stroke="#FFF" stroke-opacity=".055" stroke-width="1.5"/>
    <path d="M155 606 456 447Q465 443 474 447L614 521" stroke="#E6E6E6" stroke-opacity=".12" stroke-width="1.5"/>
    <path d="M147 626 457 790Q465 794 473 790L783 626" stroke="url(#surfaceEdge)" stroke-width="2.5"/>
    <path d="M465 798V847M154 653l68 36m486 0 68-36" stroke="#41454B" stroke-width="1.5"/>
    <path d="m432 817 25 13q8 4 16 0l25-13" stroke="#F2801E" stroke-opacity=".6" stroke-width="2"/>
  </g>

  <!-- A dedicated processor, with the quiet line weight of How it works. -->
  <g class="data-core" transform="translate(465 614) scale(.9) translate(-465 -614)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M362 614H335L315 625M568 614H595L615 625M395 524V510M535 524V510M465 710V735" stroke="#F2801E" stroke-opacity=".5" stroke-width="2"/>
    <g filter="url(#chipShadow)">
      <rect x="362" y="523" width="206" height="206" rx="24" fill="#080808"/>
      <rect class="data-core-face" x="362" y="511" width="206" height="206" rx="24" fill="#FFF"/>
      <rect x="371" y="520" width="188" height="188" rx="18" stroke="#D8D8D6" stroke-width="1.25"/>
    </g>
    <g class="data-core-symbol" transform="translate(465 614)" stroke="url(#engravedStroke)" stroke-width="3.5" filter="url(#engravedEdge)">
      <rect x="-34" y="-34" width="68" height="68" rx="6"/>
      <path d="M-18-46V-34M0-46V-34M18-46V-34M-18 34V46M0 34V46M18 34V46M-46-18H-34M-46 0H-34M-46 18H-34M34-18H46M34 0H46M34 18H46"/>
      <rect class="ui-motion ui-processor" x="-8" y="-8" width="16" height="16" rx="2" fill="#F2801E" fill-opacity=".14" stroke="none"/>
      <rect x="-15" y="-15" width="30" height="30" rx="3" fill="url(#engravedFace)" stroke-width="3"/>
      <path class="ui-motion ui-draw" pathLength="1" d="M0-15H12a3 3 0 0 1 3 3V0" stroke="#F2801E"/>
    </g>
  </g>
</svg>
