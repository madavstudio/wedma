    <rect x="325" y="208" width="14" height="14" rx="4"/>
    <rect x="591" y="208" width="14" height="14" rx="4"/>
    <rect x="263" y="323" width="14" height="14" rx="4"/>
    <rect x="653" y="323" width="14" height="14" rx="4"/>
    <rect x="343" y="425" width="14" height="14" rx="4"/>
    <rect x="573" y="425" width="14" height="14" rx="4"/>
    <rect x="458" y="295" width="14" height="14" rx="4"/>
  </g>
  <g class="data-neurons" fill="#F2801E">
    <circle cx="465" cy="162" r="2.5"/>
    <circle cx="332" cy="215" r="2.5"/>
    <circle cx="598" cy="215" r="2.5"/>
    <circle cx="270" cy="330" r="2.5"/>
    <circle cx="660" cy="330" r="2.5"/>
    <circle cx="350" cy="432" r="2.5"/>
    <circle cx="580" cy="432" r="2.5"/>
    <circle cx="465" cy="302" r="2.5"/>
  </g>
  <path d="M465 500V526" stroke="#F2801E" stroke-width="3" stroke-linecap="round"/>
  <circle class="ui-motion ui-status" cx="465" cy="500" r="6" fill="#F2801E"/>

  <!-- Thin, chamfered processor layers replace the cylindrical pedestal. -->
  <g stroke-linejoin="round" filter="url(#mainShadow)">
    <path d="M157 830 457 672Q465 668 473 672L773 830V887L473 1045Q465 1049 457 1045L157 887Z" fill="url(#platformSide)" stroke="#34383D" stroke-width="2"/>
