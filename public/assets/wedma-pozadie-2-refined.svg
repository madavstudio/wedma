<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="901" height="2047" viewBox="0 0 901 2047" preserveAspectRatio="xMidYMid slice">
  <title>WEDMA results — restrained hero palette</title>
  <desc>Two large cropped document forms on a charcoal to orange gradient, matching the hero section.</desc>

  <defs>
    <linearGradient id="bg" x1="-150" y1="-400" x2="1120" y2="2350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A0A0A"/>
      <stop offset="0.32" stop-color="#8A4F1E"/>
      <stop offset="0.67" stop-color="#F2801E"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>

    <linearGradient id="paperTop" x1="-270" y1="-380" x2="370" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E6E6E6"/>
      <stop offset="0.38" stop-color="#F6A45E"/>
      <stop offset="0.70" stop-color="#F2801E"/>
      <stop offset="1" stop-color="#51351F"/>
    </linearGradient>

    <linearGradient id="paperMiddle" x1="-280" y1="-250" x2="360" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7BD8B"/>
      <stop offset="0.42" stop-color="#F2801E"/>
      <stop offset="1" stop-color="#0D1B1E"/>
    </linearGradient>

    <linearGradient id="paperLow" x1="-270" y1="-100" x2="370" y2="350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F2801E"/>
      <stop offset="0.48" stop-color="#6D3B22"/>
      <stop offset="1" stop-color="#0D1B1E"/>
    </linearGradient>

    <linearGradient id="edgeLight" x1="-260" y1="-40" x2="20" y2="290" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7BB88"/>
      <stop offset="0.52" stop-color="#F2801E"/>
      <stop offset="1" stop-color="#563621"/>
    </linearGradient>

    <linearGradient id="edgeDark" x1="370" y1="-180" x2="10" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B471E"/>
      <stop offset="0.5" stop-color="#51351F"/>
      <stop offset="1" stop-color="#0D1B1E"/>
    </linearGradient>

    <linearGradient id="fold" x1="180" y1="-370" x2="360" y2="-140" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E6E6E6"/>
      <stop offset="0.52" stop-color="#F2801E"/>
      <stop offset="1" stop-color="#51351F"/>
    </linearGradient>

<linearGradient id="ribbonLight" x1="0" y1="2047" x2="901" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E6E6E6" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#E6E6E6" stop-opacity="0.15"/>
      <stop offset="0.76" stop-color="#F7B47A" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#E6E6E6" stop-opacity="0"/>
    </linearGradient>

<clipPath id="canvas">
      <rect width="901" height="2047"/>
    </clipPath>

    <!-- A custom WEDMA document stack built only from crisp isometric polygons. -->
    <g id="documentStack">
      <!-- lower document -->
      <polygon points="-280,-20 120,-250 380,-100 -20,130" fill="url(#paperLow)"/>
      <polygon points="-280,-20 -20,130 -20,220 -280,70" fill="url(#edgeLight)"/>
      <polygon points="-20,130 380,-100 380,-10 -20,220" fill="url(#edgeDark)"/>

      <!-- middle document -->
      <polygon points="-280,-125 120,-355 380,-205 -20,25" fill="url(#paperMiddle)"/>
      <polygon points="-280,-125 -20,25 -20,100 -280,-50" fill="url(#edgeLight)"/>
      <polygon points="-20,25 380,-205 380,-130 -20,100" fill="url(#edgeDark)"/>

      <!-- top document -->
      <path d="M-280-230L120-460L380-310L285-255L285-165L-20 10Z" fill="url(#paperTop)"/>
      <polygon points="-280,-230 -20,-80 -20,10 -280,-140" fill="url(#edgeLight)"/>
      <polygon points="-20,-80 285,-255 285,-165 -20,10" fill="url(#edgeDark)"/>

      <!-- folded page corner -->
      <polygon points="120,-460 380,-310 285,-255" fill="url(#fold)"/>
      <polygon points="120,-460 120,-370 285,-255" fill="#0D1B1E" fill-opacity="0.56"/>

      <!-- minimal document lines -->
      <polygon points="-176,-218 42,-344 88,-317 -130,-191" fill="#0D1B1E" fill-opacity="0.62"/>
      <polygon points="-150,-156 118,-311 151,-292 -117,-137" fill="#E6E6E6" fill-opacity="0.72"/>
      <polygon points="-94,-117 122,-242 155,-223 -61,-98" fill="#0D1B1E" fill-opacity="0.34"/>

      <!-- restrained construction edges matching the supplied SVG -->
      <path d="M-280-230L120-460L380-310M-280-125L120-355L380-205M-280-20L120-250L380-100" fill="none" stroke="#0D1B1E" stroke-opacity="0.10" stroke-width="1.5"/>
    </g>
  </defs>

  <g clip-path="url(#canvas)">
    <rect width="901" height="2047" fill="url(#bg)"/>

    <!-- Only two perimeter forms; the middle remains quiet behind the cards. -->
    <use xlink:href="#documentStack" transform="translate(835 225) scale(.95)" opacity="0.42"/>
    <use xlink:href="#documentStack" transform="translate(75 1835) rotate(180) scale(1.1)" opacity="0.48"/>
  </g>
</svg>
